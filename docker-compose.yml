services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: investhub
      POSTGRES_PASSWORD: investhub_dev
      POSTGRES_DB: investhub
    ports:
      - "5432:5432"
    volumes:
      - investhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  investhub_pgdata:
