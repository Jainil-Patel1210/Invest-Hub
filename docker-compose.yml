services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: investhub
      POSTGRES_PASSWORD: investhub_dev
      POSTGRES_DB: investhub
    ports:
      # Host port 5433 -> container port 5432. Not 5432:5432 -- a native
      # Postgres install on this machine already owns host port 5432.
      - "5433:5432"
    volumes:
      - investhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  investhub_pgdata:
